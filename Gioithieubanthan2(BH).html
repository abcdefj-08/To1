<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Giới thiệu bản thân</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand&family=Playfair+Display&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #FFE4E1;
            font-family: 'Quicksand', sans-serif;}
        .container {
            width: 100%;
            min-height: 100vh;
            background-color: #fff8f3;
            padding: 30px;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            font-family: 'Playfair Display', serif;
            color: #d36c6c;
            font-size: 40px;
        }

        h2 {
            color: #7d5a5a;
            border-bottom: 2px solid #e8b4b8;
            padding-bottom: 5px;
        }
        p {
            font-size: 18px;
            color: #444444;
        }

        span {
            font-weight: bold;
            color: #b05f6d;
        }
        img {
            width: 160px;
            height: 200px;
            display: block;
            margin: 20px auto;
            border-radius: 10px;
            border: 3px solid #e8b4b8;
        }

        ul {
            font-size: 18px;
            color: #444;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>GIỚI THIỆU BẢN THÂN</h1>
        <img src="https://files.catbox.moe/nah1ms.jpg" alt="Ảnh cá nhân" class="img">

        <p><span>Họ và tên:</span> Bùi Thị Thu Hằng </p>
        <p><span>Ngày tháng năm sinh:</span> 15/02/2008</p>
        <p><span>Lớp:</span> 12A2 </p>
        <p><span>Trường:</span> Trường THPT Nguyễn Trân </p>

        <h2>Sở thích</h2>
        <ul>
            <li>Nghe nhạc</li>
            <li>Đọc sách</li>
            <li>Chơi thể thao</li>
        </ul>
